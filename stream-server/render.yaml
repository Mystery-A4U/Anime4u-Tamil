services:
  - type: web
    name: anime4u-stream
    runtime: python
    rootDir: stream-server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_SESSION_STRING
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB
        value: anime4u
      - key: MONGO_COLLECTION
        value: telegram_files
      - key: STREAM_TOKEN
        sync: false
